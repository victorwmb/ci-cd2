name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  unit_integration_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Install dependencies and test React
        run: |
          npm ci
          npm test
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install Python dependencies and test API
        run: |
          pip install -r api/requirements.txt
          pytest api/test_server.py

  infrastructure_and_e2e_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start Docker Architecture
        run: |

          export MYSQL_ROOT_PASSWORD=root
          export ADMIN_EMAIL=loise.fenoll@ynov.com
          export ADMIN_PASSWORD=PvdrTAzTeR247sDnAZBr
          docker compose up -d
      - name: Wait for services to be healthy
        run: |
          sleep 10

          for i in {1..12}; do
            REACT_ID=$(docker compose ps -q react)
            API_ID=$(docker compose ps -q api)
            DB_ID=$(docker compose ps -q db)
            
            if [ -n "$REACT_ID" ] && [ -n "$API_ID" ] && [ -n "$DB_ID" ]; then
              if [ "$(docker inspect -f '{{.State.Health.Status}}' $REACT_ID 2>/dev/null)" == "healthy" ] && \
                 [ "$(docker inspect -f '{{.State.Health.Status}}' $API_ID 2>/dev/null)" == "healthy" ] && \
                 [ "$(docker inspect -f '{{.State.Health.Status}}' $DB_ID 2>/dev/null)" == "healthy" ]; then
                echo "All services are healthy!"
                break
              fi
            fi
            echo "Waiting for services to become healthy..."
            sleep 10
          done
          docker compose ps
      - name: Setup Node.js for Cypress
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Install NPM dependencies
        run: npm ci
      - name: Run Infrastructure Tests
        run: npx cypress run --spec "cypress/e2e/docker-infra.cy.ts"
        env:
          CYPRESS_BASE_URL: http://localhost:5173
      - name: Run Cypress E2E Tests
        run: npx cypress run --spec "cypress/e2e/app.cy.ts"
        env:
          CYPRESS_BASE_URL: http://localhost:5173

  deploy_back:
    needs: [unit_integration_tests, infrastructure_and_e2e_tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Install uv for Vercel Python Build
        run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy_front:
    needs: [unit_integration_tests, infrastructure_and_e2e_tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Install dependencies
        run: npm ci
      - name: Build React App
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.PROD_API_URL }}
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
